<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liga Colombiana - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .hero {
            padding: 120px 0;
            background: url('https://source.unsplash.com/random/1920x1080/?soccer-stadium') no-repeat center center;
            background-size: cover;
            position: relative;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, rgba(15,23,42,0.85), rgba(30,58,138,0.75));
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .card-menu {
            transition: all 0.4s ease;
            border: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .card-menu:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5) !important;
        }

        .btn-competiciones {
            background: linear-gradient(45deg, #dc2626, #f97316);
            border: none;
            font-size: 1.4rem;
            padding: 18px 50px;
            transition: all 0.3s;
        }
        
        .btn-competiciones:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #b91c1c, #ea580c);
            box-shadow: 0 10px 30px rgba(220,38,38,0.5);
        }

        h1 {
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #fff; }
            to { text-shadow: 0 0 25px #60a5fa, 0 0 40px #3b82f6; }
        }
		
		
    </style>
</head>
<body>
    <div class="hero text-center">
        <div class="container hero-content">
            <h1 class="display-1 fw-bold mb-3">
                ⚽ LIGA COLOMBIANA
            </h1>
            <p class="lead fs-2 mb-4 text-light">Gestión Profesional de Equipos de Fútbol</p>

            <div class="row justify-content-center g-4">
                <div class="col-md-3">
                    <a href="/clubs" class="text-decoration-none">
                        <div class="card card-menu text-white h-100">
                            <div class="card-body text-center py-5">
                                <i class="fas fa-futbol fa-4x mb-3"></i>
                                <h4>Clubes</h4>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/entrenadores" class="text-decoration-none">
                        <div class="card card-menu text-white h-100">
                            <div class="card-body text-center py-5">
                                <i class="fas fa-user-tie fa-4x mb-3"></i>
                                <h4>Entrenadores</h4>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/jugadores" class="text-decoration-none">
                        <div class="card card-menu text-white h-100">
                            <div class="card-body text-center py-5">
                                <i class="fas fa-running fa-4x mb-3"></i>
                                <h4>Jugadores</h4>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/asociaciones" class="text-decoration-none">
                        <div class="card card-menu text-white h-100">
                            <div class="card-body text-center py-5">
                                <i class="fas fa-building fa-4x mb-3"></i>
                                <h4>Asociaciones</h4>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Botón Competiciones más grande y con gradiente -->
            <div class="mt-5">
                <a href="/competiciones" class="btn btn-competiciones btn-lg text-white fw-bold">
                    <i class="fas fa-trophy me-3"></i> COMPETICIONES
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
