<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jugadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            color: white;
            min-height: 100vh;
        }
        .table-container {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-running text-info"></i> Jugadores de la Liga</h1>
            <a href="/jugadores/nuevo" class="btn btn-success btn-lg">
                <i class="fas fa-plus"></i> Nuevo Jugador
            </a>
        </div>

        <div class="table-container shadow-lg p-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>Número</th>
                        <th>Posición</th>
						<th>Acciones</th>
						
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${jugadores}">
                        <td th:text="${j.id}"></td>
                        <td><strong th:text="${j.nombre + ' ' + j.apellido}"></strong></td>
                        <td th:text="${j.numero}"></td>
                        <td th:text="${j.posicion}"></td>
						<td>
						    <a th:href="@{/jugadores/editar/{id}(id=${j?.id})}" class="btn btn-warning btn-sm me-1">
						        <i class="fas fa-edit"></i>
						    </a>
						    <a th:href="@{/jugadores/eliminar/{id}(id=${j?.id})}" 
						       class="btn btn-danger btn-sm"
						       onclick="return confirm('¿Eliminar este jugador?')">
						        <i class="fas fa-trash"></i>
						    </a>
						</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-secondary mt-4">← Volver al Inicio</a>
    </div>
</body>
</html>
