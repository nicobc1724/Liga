<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clubes Liga Colombiana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="mb-4">🏟️ Clubes de la Liga Colombiana</h1>
    <a href="/clubs/nuevo" class="btn btn-success mb-3">+ Nuevo Club</a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Entrenador</th>
                <th>Asociación</th>
                <th>Jugadores</th>
                <th>Competiciones</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="club : ${clubs}">
                <td th:text="${club.id}"></td>
                <td th:text="${club.nombre}"></td>
                <td th:text="${club.entrenador?.nombre + ' ' + club.entrenador?.apellido}"></td>
                <td th:text="${club.asociacion?.nombre}"></td>
                <td th:text="${club.jugadores.size()}"></td>
                <td th:text="${club.competiciones.size()}"></td>
                <td>
                    <a th:href="@{/clubs/editar/{id}(id=${club.id})}" class="btn btn-warning btn-sm">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
