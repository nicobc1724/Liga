<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 th:text="${club.id} != null ? 'Editar Club' : 'Nuevo Club'"></h1>

    <form th:action="@{/clubs}" th:object="${club}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre del Club</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <!-- Entrenador -->
        <div class="mb-3">
            <label>Nombre Entrenador</label>
            <input type="text" class="form-control" th:field="*{entrenador.nombre}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar Club</button>
        <a href="/clubs" class="btn btn-secondary">Volver</a>
    </form>
</body>
</html>
