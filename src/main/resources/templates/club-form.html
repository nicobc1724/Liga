<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${club.id != null ? 'Editar Club' : 'Nuevo Club'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="fas fa-futbol me-2"></i>
                    <span th:text="${club.id != null ? 'Editar Club' : 'Nuevo Club'}"></span>
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/clubs}" th:object="${club}" method="post">
                    
                    <input type="hidden" th:field="*{id}" />

                    <div class="row">
                        <div class="col-md-12">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Nombre del Club</label>
                                <input type="text" class="form-control form-control-lg" 
                                       th:field="*{nombre}" placeholder="Ej: Millonarios FC" required>
                            </div>
                        </div>
                    </div>

                    <!-- Entrenador -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Entrenador</label>
                        <select class="form-select" name="entrenadorId">
                            <option value="">-- Seleccione Entrenador --</option>
                            <option th:each="e : ${entrenadores}" 
                                    th:value="${e.id}" 
                                    th:text="${e.nombre + ' ' + e.apellido}"
                                    th:selected="${club.entrenador?.id == e.id}"></option>
                        </select>
                    </div>

                    <!-- Asociación -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Asociación</label>
                        <select class="form-select" name="asociacionId">
                            <option value="">-- Seleccione Asociación --</option>
                            <option th:each="a : ${asociaciones}" 
                                    th:value="${a.id}" 
                                    th:text="${a.nombre}"
                                    th:selected="${club.asociacion?.id == a.id}"></option>
                        </select>
                    </div>

                    <!-- Jugadores -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Jugadores</label>
                        <div class="border p-3 bg-light" style="max-height: 220px; overflow-y: auto; border-radius: 8px;">
                            <div th:each="j : ${jugadores}" class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" 
                                       th:value="${j.id}" name="jugadorIds"
                                       th:checked="${club.jugadores?.contains(j)}">
                                <label class="form-check-label">
                                    <strong th:text="${j.nombre + ' ' + j.apellido}"></strong>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Competiciones -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Competiciones Participantes</label>
                        <div class="border p-3 bg-light" style="max-height: 220px; overflow-y: auto; border-radius: 8px;">
                            <div th:each="c : ${competiciones}" class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" 
                                       th:value="${c.id}" name="competicionIds"
                                       th:checked="${club.competiciones?.contains(c)}">
                                <label class="form-check-label" th:text="${c.nombre}"></label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/clubs" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
