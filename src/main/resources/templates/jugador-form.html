<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Jugador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="fas fa-user me-2"></i>
                    Nuevo Jugador
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/jugadores}" th:object="${jugador}" method="post">
					
					<input type="hidden" th:field="*{id}" />
					
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Apellido</label>
                            <input type="text" class="form-control" th:field="*{apellido}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Número</label>
                            <input type="number" class="form-control" th:field="*{numero}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Posición</label>
                            <input type="text" class="form-control" th:field="*{posicion}">
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/jugadores" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save"></i> Guardar Jugador
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
