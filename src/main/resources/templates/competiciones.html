<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Competiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%);
            color: white;
            min-height: 100vh;
        }
        .table-container {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-trophy text-warning"></i> Competiciones</h1>
            <a href="/competiciones/nuevo" class="btn btn-success btn-lg">
                <i class="fas fa-plus"></i> Nueva Competición
            </a>
        </div>

        <div class="table-container shadow-lg p-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Premio</th>
                        <th>Inicio</th>
                        <th>Fin</th>
						<th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${competiciones}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.nombre}"></td>
                        <td th:text="${c.montoPremio}"></td>
                        <td th:text="${c.fechaInicio}"></td>
                        <td th:text="${c.fechaFin}"></td>
						<td>
						    <a th:href="@{/competiciones/editar/{id}(id=${c?.id})}" class="btn btn-warning btn-sm me-1">
						        <i class="fas fa-edit"></i>
						    </a>
						    <a th:href="@{/competiciones/eliminar/{id}(id=${c?.id})}" 
						       class="btn btn-danger btn-sm"
						       onclick="return confirm('¿Eliminar esta competición?')">
						        <i class="fas fa-trash"></i>
						    </a>
						</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-secondary mt-4">← Volver al Inicio</a>
    </div>
</body>
</html>
