<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acerca del Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h3>Acerca del Proyecto</h3>
            </div>
            <div class="card-body">
                <h5>Relaciones JPA Implementadas:</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">@OneToOne - Club ↔ Entrenador</li>
                    <li class="list-group-item">@OneToMany - Club → Jugadores</li>
                    <li class="list-group-item">@ManyToOne - Club → Asociación</li>
                    <li class="list-group-item">@ManyToMany - Club ↔ Competiciones</li>
                </ul>
            </div>
        </div>
        <a href="/" class="btn btn-primary mt-3">Volver al Inicio</a>
    </div>
</body>
</html>
