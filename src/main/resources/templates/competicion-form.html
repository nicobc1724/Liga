<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Competición</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">
                    <i class="fas fa-trophy me-2"></i>
                    Nueva Competición
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/competiciones}" th:object="${competicion}" method="post">
					
					<input type="hidden" th:field="*{id}" />
					
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre de la Competición</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Monto del Premio</label>
                            <input type="number" class="form-control" th:field="*{montoPremio}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Fecha Inicio</label>
                            <input type="date" class="form-control" th:field="*{fechaInicio}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Fecha Fin</label>
                            <input type="date" class="form-control" th:field="*{fechaFin}">
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/competiciones" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save"></i> Guardar Competición
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
