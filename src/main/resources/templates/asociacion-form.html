<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asociación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-warning text-dark">
                <h3 class="mb-0">
                    <i class="fas fa-building me-2"></i>
                    Nueva Asociación
                </h3>
            </div>
            <div class="card-body">
                <form th:action="@{/asociaciones}" th:object="${asociacion}" method="post">
					
					<input type="hidden" th:field="*{id}" />
					
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre de la Asociación</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">País</label>
                        <input type="text" class="form-control" th:field="*{pais}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Presidente</label>
                        <input type="text" class="form-control" th:field="*{presidente}">
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/asociaciones" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save"></i> Guardar Asociación
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
