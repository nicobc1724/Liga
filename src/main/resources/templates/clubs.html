<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clubes - Liga Colombiana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            color: white;
            min-height: 100vh;
        }
        .table-container {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-orange {
            background: linear-gradient(45deg, #ff8800, #f97316);
            color: white;
            border: none;
        }
        .btn-orange:hover {
            background: linear-gradient(45deg, #e67700, #ea580c);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-futbol text-white"></i> Clubes de la Liga Colombiana</h1>
            <a href="/clubs/nuevo" class="btn btn-success btn-lg">
                <i class="fas fa-plus"></i> Nuevo Club
            </a>
        </div>

        <div class="table-container p-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Club</th>
                        <th>Entrenador</th>
                        <th>Asociación</th>
                        <th>Jugadores</th>
                        <th>Competiciones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="club : ${clubs}">
                        <td th:text="${club.id}"></td>
                        <td><strong th:text="${club.nombre}"></strong></td>
                        <td th:text="${club.entrenador?.nombre + ' ' + club.entrenador?.apellido}"></td>
                        <td th:text="${club.asociacion?.nombre}"></td>

                        <!-- Jugadores -->
                        <td>
                            <button class="btn btn-sm btn-info" type="button"
                                    data-bs-toggle="collapse" 
                                    th:data-bs-target="${'#jugadores-' + club.id}">
                                <i class="fas fa-chevron-down"></i>
                                <span th:text="${club.jugadores?.size() ?: 0}"></span>
                            </button>
                            <div class="collapse mt-2" th:id="${'jugadores-' + club.id}">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item text-dark" 
                                        th:each="j : ${club.jugadores}"
                                        th:text="${j.nombre + ' ' + j.apellido + ' (' + j.posicion + ')'}"></li>
                                </ul>
                            </div>
                        </td>

                        <!-- Competiciones -->
                        <td>
                            <button class="btn btn-sm btn-orange" type="button"
                                    data-bs-toggle="collapse" 
                                    th:data-bs-target="${'#comp-' + club.id}">
                                <i class="fas fa-chevron-down"></i>
                                <span th:text="${club.competiciones?.size() ?: 0}"></span>
                            </button>
                            <div class="collapse mt-2" th:id="${'comp-' + club.id}">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item text-dark" 
                                        th:each="c : ${club.competiciones}"
                                        th:text="${c.nombre}"></li>
                                </ul>
                            </div>
                        </td>

                        <td>
                            <a th:href="@{/clubs/editar/{id}(id=${club.id})}" class="btn btn-warning btn-sm me-1">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/clubs/eliminar/{id}(id=${club.id})}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Estás seguro de eliminar este club?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/" class="btn btn-secondary mt-4">← Volver al Inicio</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
